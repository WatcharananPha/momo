<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MaidBooking — User Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link rel="stylesheet" href="/static/liff/css/style.css?v=1.0.7">
    <link rel="stylesheet" href="/static/liff/css/design-system.css?v=1.0.7">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Inter"', 'sans-serif'] },
                    colors: {
                        brand: { DEFAULT: '#046c4e', light: '#059669', dark: '#034a36', surface: '#f0fdf4' },
                        ink: { DEFAULT: '#111827', muted: '#4b5563', light: '#9ca3af' },
                        bg: '#f9fafb'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bg antialiased text-ink">

<div id="app-container" class="h-full w-full">
    
    <div id="loading" class="fixed inset-0 bg-brand z-[9999] flex flex-col items-center justify-center">
        <div class="w-10 h-10 border-4 border-white/20 border-t-white rounded-full animate-spin"></div>
    </div>

    <div id="app-content" class="h-full w-full overflow-y-auto scroll-hide pb-[120px]">
        <div class="pt-[env(safe-area-inset-top,24px)]"></div>

        <!-- High-End Header -->
        <header class="px-6 pt-10 pb-10 flex flex-col items-center text-center relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-b from-brand/5 to-transparent -z-10"></div>
            <div class="relative mb-5 group">
                <div class="absolute inset-0 bg-brand/10 rounded-[36px] blur-xl group-hover:bg-brand/20 transition-all opacity-0 group-hover:opacity-100"></div>
                <img id="user-picture" src="https://ui-avatars.com/api/?name=Guest&background=f3f4f6&color=111827" alt="Profile" class="w-28 h-28 rounded-[36px] object-cover border-4 border-white shadow-2xl relative z-10 transition-transform active:scale-95">
                <div class="absolute -bottom-1 -right-1 w-8 h-8 bg-brand border-4 border-white rounded-full z-20 flex items-center justify-center">
                    <svg class="w-3.5 h-3.5 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"></path></svg>
                </div>
            </div>
            <h1 class="text-[28px] font-black text-ink tracking-tighter leading-none mb-2" id="user-name">Guest User</h1>
            <div class="inline-flex items-center bg-brand/5 px-4 py-1.5 rounded-full border border-brand/10">
                <svg class="w-3.5 h-3.5 text-brand mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2z"></path></svg>
                <span class="text-[13px] font-black text-brand uppercase tracking-widest" id="user-tier">Silver Member</span>
            </div>
        </header>

        <!-- Menu Groups -->
        <section class="px-6 space-y-6">
            <!-- Account Section -->
            <div class="bg-white rounded-[32px] overflow-hidden shadow-sm border border-gray-100/50 p-2">
                <div class="p-4 flex items-center justify-between group">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center border border-indigo-100/50">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        </div>
                        <div>
                            <span class="font-black text-[15px] text-ink block leading-tight">Referral Program</span>
                            <span class="text-[12px] font-bold text-indigo-600/60 uppercase tracking-wider" id="ref-code-text">MB-XXXX</span>
                        </div>
                    </div>
                    <button class="bg-indigo-600 text-white font-black text-[11px] px-5 py-2.5 rounded-xl shadow-lg shadow-indigo-200 btn-press uppercase tracking-widest" onclick="shareReferral()">Share</button>
                </div>
            </div>

            <!-- Settings Group -->
            <div class="bg-white rounded-[32px] overflow-hidden shadow-sm border border-gray-100/50 p-2">
                <div class="p-4 flex items-center justify-between btn-press cursor-pointer group" onclick="showToast('Preferences coming soon', 'info')">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-slate-50 text-slate-500 rounded-2xl flex items-center justify-center border border-slate-100/50">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </div>
                        <span class="font-black text-[15px] text-ink block leading-tight">Preferences</span>
                    </div>
                    <svg class="w-5 h-5 text-ink-light group-hover:text-ink transition-colors" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"></path></svg>
                </div>
                <div class="h-px bg-gray-50 mx-4"></div>
                <div class="p-4 flex items-center justify-between btn-press cursor-pointer group" onclick="showToast('Support Center', 'info')">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-slate-50 text-slate-500 rounded-2xl flex items-center justify-center border border-slate-100/50">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M5.636 5.636l3.536 3.536m0 5.656l-3.536 3.536M9.172 9.172a4 4 0 105.656 5.656 4 4 0 00-5.656-5.656z"></path></svg>
                        </div>
                        <span class="font-black text-[15px] text-ink block leading-tight">Help & Support</span>
                    </div>
                </div>
            </div>

            <!-- Danger Zone -->
            <button onclick="liff.logout(); localStorage.removeItem('momo_token'); location.reload();" class="w-full bg-red-50/50 text-red-500 font-black py-5 rounded-[28px] btn-press text-[14px] border border-red-100/50 uppercase tracking-[0.1em]">
                Secure Log Out
            </button>
            
            <p class="text-center text-[11px] font-black text-ink-light uppercase tracking-widest opacity-40">MaidBooking v1.0.7</p>
        </section>
    </div>

    <!-- Navigation (Unified) -->
    <nav class="fixed bottom-0 w-full max-w-[430px] left-1/2 -translate-x-1/2 bg-white/80 backdrop-blur-xl border-t border-gray-100 flex justify-around items-center px-6 py-5 z-[200] pb-[calc(1.2rem+env(safe-area-inset-bottom))] shadow-xl">
        <a href="/liff/index" class="text-ink-light hover:text-brand transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path></svg></a>
        <a href="/liff/tracking" class="text-ink-light hover:text-brand transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg></a>
        <a href="/liff/profile" class="text-brand transform scale-110"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path></svg></a>
    </nav>
</div>

<script src="/static/liff/js/app.js?v=1.0.6"></script>
<script>
    async function initProfile() {
        await initCoreLiff(true);
        if (userProfile) {
            document.getElementById('user-name').textContent = userProfile.displayName;
            document.getElementById('user-picture').src = userProfile.pictureUrl;
            
            try {
                const res = await fetch(`${API_BASE}/points/balance/me`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('ref-code-text').textContent = data.referral_code || 'MB-CODE';
                    
                    const tierNames = { SILVER: 'Silver Member', GOLD: 'Gold Member', PLATINUM: 'Platinum Member', DIAMOND: 'Diamond Member' };
                    document.getElementById('user-tier').textContent = tierNames[data.tier] || 'Silver Member';
                }
            } catch (e) {
                console.error("Profile load error", e);
            }
        }
        setTimeout(hideLoading, 400);
    }
    document.addEventListener("DOMContentLoaded", initProfile);
</script>
</body>
</html>
