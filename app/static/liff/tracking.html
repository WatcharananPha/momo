<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Momo — Live Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MAP_API placeholder: server will replace __MAP_API__ with real key at serve time -->
    <meta name="maps-api-key" content="__MAP_API__">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link rel="stylesheet" href="/static/liff/css/style.css?v=1.0.4">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Inter"', 'sans-serif'] },
                    colors: {
                        brand: { DEFAULT: '#046c4e', light: '#059669', dark: '#034a36', surface: '#eefcf6' },
                        ink: { DEFAULT: '#111827', muted: '#6b7280', light: '#9ca3af' },
                        bg: '#f4f7f6'
                    }
                }
            }
        }
    </script>
    <style>
        body, html { height: 100%; overflow: hidden; }
        .btn-press:active { transform: scale(0.95); transition: transform 0.1s; }
        #map-container { position: absolute; inset: 0; z-index: 0; }
        #bottom-sheet { transform: translateY(0); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="bg-slate-100">

<div id="app-container" class="h-full w-full relative">
    
    <div id="loading" class="fixed inset-0 bg-brand z-[9999] flex flex-col items-center justify-center">
        <div class="spinner-large"></div>
        <div class="font-bold tracking-widest uppercase text-sm mt-2 text-white">Initializing Tracking</div>
    </div>

    <!-- Main Content Layout (Layered) -->
    <div id="app-content" class="h-full w-full relative overflow-hidden">
        
        <!-- Layer 0: Google Map Full Screen -->
        <div id="map-container" class="hidden">
            <div id="map" class="w-full h-full"></div>
        </div>

        <!-- Layer 1: Top Controls (Back Button) -->
        <div class="absolute top-0 left-0 w-full z-20 pt-[env(safe-area-inset-top,20px)] px-4 pointer-events-none">
            <a href="/liff/index" class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-lg border border-gray-100 btn-press pointer-events-auto">
                <svg class="w-6 h-6 text-ink" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
            </a>
        </div>

        <!-- Layer 1: Floating Action Button (Recenter) -->
        <div class="absolute right-4 z-20 pointer-events-auto transition-all" style="bottom: calc(240px + env(safe-area-inset-bottom, 20px));">
            <button id="recenter-btn" class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-xl border border-gray-50 btn-press">
                <svg class="w-6 h-6 text-brand" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2m0 16v2M4 12H2m20 0h-2"></path>
                </svg>
            </button>
        </div>

        <!-- Layer 2: Bottom Sheet Card (Grab-like) -->
        <div id="bottom-sheet" class="absolute bottom-0 w-full bg-white rounded-t-[32px] shadow-[0_-10px_40px_rgba(0,0,0,0.12)] z-40 pb-[env(safe-area-inset-bottom,20px)]">
            
            <!-- Handle -->
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mt-4 mb-4"></div>
            
            <!-- Header: ETA & Status -->
            <div class="px-6 mb-4 flex justify-between items-center">
                <div>
                    <h3 class="text-[22px] font-black text-ink leading-tight" id="status-title">Searching for Professional</h3>
                    <p class="text-[14px] text-ink-muted font-bold mt-0.5 uppercase tracking-wide" id="distance-display">Initializing...</p>
                </div>
                <div class="text-right">
                    <div class="bg-brand-surface text-brand font-black px-4 py-2 rounded-xl text-[16px] shadow-sm border border-brand/10" id="eta-display-small">-- min</div>
                </div>
            </div>

            <hr class="border-gray-100 mx-6 mb-5">

            <!-- Maid Info Section -->
            <div class="flex items-center gap-4 px-6 mb-6">
                <div class="w-[60px] h-[60px] rounded-2xl overflow-hidden bg-slate-100 border-2 border-brand-surface shadow-sm relative">
                    <img id="maid-pic" src="https://ui-avatars.com/api/?name=Maid&background=046c4e&color=fff" class="w-full h-full object-cover" alt="">
                    <div class="absolute bottom-1 right-1 w-3.5 h-3.5 bg-emerald-500 border-2 border-white rounded-full"></div>
                </div>
                <div class="flex-1">
                    <h2 class="font-black text-[18px] text-ink" id="maid-name">Assigning...</h2>
                    <div class="flex items-center gap-2 mt-0.5">
                        <div class="flex items-center bg-yellow-50 px-2 py-0.5 rounded-md border border-yellow-100">
                            <svg class="w-3.5 h-3.5 text-yellow-500 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                            <span class="text-[12px] font-black text-yellow-700 ml-1" id="maid-rating">--</span>
                        </div>
                        <span class="text-[13px] font-bold text-ink-muted" id="maid-tier">• Loading Tier</span>
                    </div>
                </div>
                <!-- Mini Actions -->
                <div class="flex gap-2.5">
                    <button class="w-11 h-11 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center border border-blue-100 btn-press" onclick="showToast('Calling professional...', 'info')">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"></path></svg>
                    </button>
                    <button class="w-11 h-11 rounded-2xl bg-brand-surface text-brand flex items-center justify-center border border-brand/10 btn-press" onclick="showToast('Connecting to LINE Chat...', 'info')">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Tracker Steps (Simplified Horizontal for Bottom Sheet) -->
            <div class="px-6 mb-2">
                <div class="flex justify-between items-center relative mb-4">
                    <div class="absolute h-1 bg-slate-100 left-0 right-0 z-0 rounded-full"></div>
                    <div id="tracker-progress" class="absolute h-1 bg-brand left-0 z-0 rounded-full transition-all duration-700" style="width: 0%"></div>
                    
                    <div class="w-6 h-6 bg-white border-4 border-slate-100 rounded-full relative z-10 transition-colors" id="step-1"></div>
                    <div class="w-6 h-6 bg-white border-4 border-slate-100 rounded-full relative z-10 transition-colors" id="step-2"></div>
                    <div class="w-6 h-6 bg-white border-4 border-slate-100 rounded-full relative z-10 transition-colors" id="step-3"></div>
                    <div class="w-6 h-6 bg-white border-4 border-slate-100 rounded-full relative z-10 transition-colors" id="step-4"></div>
                </div>
            </div>
        </div>

        <!-- Terminal: Review Section (Layer 3) -->
        <section id="review-section" class="fixed inset-x-0 bottom-0 bg-brand rounded-t-[32px] p-8 text-white text-center z-[50] hidden translate-y-full transition-transform duration-500">
            <h3 class="font-black text-[24px] mb-2 text-white">Rate your professional</h3>
            <p class="text-brand-surface opacity-80 text-[14px] mb-8">Earn 10 Momo Points for your review.</p>
            
            <div class="flex justify-center gap-3 mb-8">
                <button class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center text-2xl" onclick="setRating(1)">★</button>
                <button class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center text-2xl" onclick="setRating(2)">★</button>
                <button class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center text-2xl" onclick="setRating(3)">★</button>
                <button class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center text-2xl" onclick="setRating(4)">★</button>
                <button class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center text-2xl" onclick="setRating(5)">★</button>
            </div>
            
            <button class="w-full bg-white text-brand font-black py-4 rounded-2xl btn-press shadow-xl" onclick="submitReview()">Submit Rating</button>
        </section>
    </div>

    <!-- Invisible Debug Overlay -->
    <div id="debug-overlay" class="fixed top-4 right-4 text-[8px] opacity-0 pointer-events-none">
        <span id="debug-liff"></span> <span id="debug-key"></span> <span id="debug-sdk"></span> <span id="debug-cb"></span>
    </div>
</div>

<script>
    window.updateDebug = function(id, msg) { console.log(`[Debug] ${id}: ${msg}`); }
    window.gm_authFailure = function() { console.error("GM Auth Failure"); }
</script>

<script src="/static/liff/js/app.js?v=1.0.5"></script>
<script src="/static/liff/js/tracking.js?v=1.0.5"></script>

<!-- Load SDK -->
<script src="https://maps.googleapis.com/maps/api/js?key=__MAP_API__&libraries=maps,marker,geometry&callback=initTrackingMap" async defer></script>

</body>
</html>
