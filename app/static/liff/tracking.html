<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Momo — Live Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="maps-api-key" content="__MAP_API__">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link rel="stylesheet" href="/static/liff/css/style.css?v=1.0.8">
    <link rel="stylesheet" href="/static/liff/css/design-system.css?v=1.0.8">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Sanomat Grab TH"', '"Inter"', 'sans-serif'] },
                    colors: {
                        brand: { DEFAULT: '#046c4e', light: '#059669', dark: '#034a36', surface: '#f0fdf4' },
                        ink: { DEFAULT: '#0a0f18', muted: '#4b5563', light: '#9ca3af' }
                    },
                    boxShadow: {
                        'premium': '0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03)',
                        'sheet': '0 -10px 40px rgba(0,0,0,0.08)'
                    }
                }
            }
        }
    </script>
    <style>
        body, html { height: 100%; overflow: hidden; background: #f8fafc; font-family: 'Sanomat Grab TH', 'Inter', sans-serif; }
        #map-container { position: absolute; inset: 0; z-index: 0; background: #f3f4f6; }
        
        /* Interactive Bottom Sheet */
        #bottom-sheet { 
            position: absolute;
            bottom: 0;
            width: 100%;
            background: white;
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.06);
            z-index: 40;
            padding-bottom: env(safe-area-inset-bottom, 24px);
            transform: translateY(0);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }
        
        /* Progress Step UI (High Fidelity) */
        .step-circle { 
            width: 36px; 
            height: 36px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 900; 
            font-size: 15px; 
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            z-index: 2;
        }
        .step-circle.done { background: var(--brand); color: white; border: none; }
        .step-circle.active { background: var(--brand); color: white; box-shadow: 0 0 0 5px var(--brand-surface); border: none; }
        .step-circle.todo { background: white; border: 2.5px solid #e2e8f0; color: #94a3b8; }
        
        .step-line { 
            flex: 1; 
            height: 4px; 
            background: #f1f5f9; 
            margin: 0 -2px; 
            border-radius: 99px; 
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .step-line-fill { 
            position: absolute; 
            inset: 0; 
            background: var(--brand); 
            width: 0%; 
            transition: width 1s cubic-bezier(0.65, 0, 0.35, 1); 
        }

        .btn-press:active { transform: scale(0.94); transition: transform 0.1s; }
    </style>
</head>
<body class="antialiased">

<div id="app-container" class="h-full w-full relative">
    
    <!-- Loading Layer -->
    <div id="loading" class="fixed inset-0 bg-brand z-[9999] flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-white/20 border-t-white rounded-full animate-spin"></div>
        <div class="font-black tracking-[0.2em] uppercase text-[12px] mt-8 text-white/90">Premium Experience</div>
    </div>

    <div id="app-content" class="h-full w-full relative overflow-hidden">
        
        <div id="map-container">
            <div id="map" class="w-full h-full grayscale-[0.05] contrast-[1.02]"></div>
        </div>

        <!-- Floating Controls -->
        <div class="absolute top-0 left-0 w-full z-20 pt-[env(safe-area-inset-top,24px)] px-6 pointer-events-none">
            <a href="/liff/index" class="w-12 h-12 bg-white rounded-[20px] flex items-center justify-center shadow-premium border border-gray-100 btn-press pointer-events-auto">
                <svg class="w-6 h-6 text-ink" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
            </a>
        </div>

        <div class="absolute right-6 z-20 pointer-events-auto transition-all" id="fab-container" style="bottom: calc(280px + env(safe-area-inset-bottom, 24px));">
            <button id="recenter-btn" class="w-14 h-14 bg-brand text-white rounded-[24px] flex items-center justify-center shadow-xl btn-press">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3.5" viewBox="0 0 24 24">
                    <path d="M12 2v2m0 16v2M4 12H2m20 0h-2"></path><circle cx="12" cy="12" r="3.5"></circle>
                </svg>
            </button>
        </div>

        <!-- Layer 2: Bottom Sheet -->
        <div id="bottom-sheet">
            
            <div id="drag-handle" class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mt-4 mb-8 cursor-grab active:cursor-grabbing"></div>
            
            <div class="px-8 flex justify-between items-start mb-8">
                <div>
                    <span class="text-[11px] font-black uppercase tracking-[0.25em] text-brand/40 block mb-2">Live Tracking</span>
                    <h3 class="text-[28px] font-black text-ink leading-none tracking-tighter" id="status-title">Searching...</h3>
                    <p class="text-[14px] text-ink-muted font-bold mt-2.5 flex items-center gap-2.5" id="distance-display">
                        <span class="w-2 h-2 bg-brand rounded-full animate-pulse shadow-[0_0_8px_rgba(4,108,78,0.5)]"></span>
                        Synchronizing GPS
                    </p>
                </div>
                <div class="bg-brand-surface text-brand font-black px-4 py-2.5 rounded-[20px] text-[17px] border border-brand/10 shadow-sm" id="eta-display-small">-- min</div>
            </div>

            <!-- Custom Progress Step UI (Principal Designer Version) -->
            <div class="px-8 mb-10">
                <div class="flex items-center">
                    <div class="step-circle active" id="step-node-1">1</div>
                    <div class="step-line"><div class="step-line-fill" id="step-line-1"></div></div>
                    
                    <div class="step-circle todo" id="step-node-2">2</div>
                    <div class="step-line"><div class="step-line-fill" id="step-line-2"></div></div>
                    
                    <div class="step-circle todo" id="step-node-3">3</div>
                    <div class="step-line"><div class="step-line-fill" id="step-line-3"></div></div>
                    
                    <div class="step-circle todo" id="step-node-4">4</div>
                </div>
                <div class="flex justify-between mt-4 px-0.5">
                    <div class="w-1/4 text-center"><span class="text-[10px] font-black uppercase tracking-widest text-brand leading-none block" id="label-1">Confirmed</span></div>
                    <div class="w-1/4 text-center"><span class="text-[10px] font-black uppercase tracking-widest text-ink-light leading-none block" id="label-2">Arrived</span></div>
                    <div class="w-1/4 text-center"><span class="text-[10px] font-black uppercase tracking-widest text-ink-light leading-none block" id="label-3">In-Progress</span></div>
                    <div class="w-1/4 text-center"><span class="text-[10px] font-black uppercase tracking-widest text-ink-light leading-none block" id="label-4">Finished</span></div>
                </div>
            </div>

            <div class="px-8 pb-4">
                <div class="bg-gray-50 rounded-[36px] p-6 flex items-center gap-5 border border-gray-100/50 shadow-inner">
                    <div class="w-16 h-16 rounded-[26px] overflow-hidden bg-white border-4 border-white shadow-md shrink-0">
                        <img id="maid-pic" src="https://ui-avatars.com/api/?name=M&background=046c4e&color=fff" class="w-full h-full object-cover" alt="">
                    </div>
                    <div class="flex-1 min-w-0">
                        <h2 class="font-black text-[19px] text-ink truncate tracking-tighter" id="maid-name">Assigning...</h2>
                        <div class="flex items-center gap-2 mt-1.5">
                            <div class="flex items-center text-yellow-500 bg-white px-2 py-0.5 rounded-lg shadow-sm border border-gray-100">
                                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                                <span class="text-[13px] font-black text-ink ml-1">4.9</span>
                            </div>
                            <span class="text-[13px] font-bold text-ink-muted/60 truncate" id="maid-tier">• Loading Elite Pro</span>
                        </div>
                    </div>
                    <button class="w-12 h-12 rounded-[22px] bg-white border border-gray-200 text-blue-600 flex items-center justify-center btn-press shadow-sm" onclick="showToast('Calling professional...', 'info')">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"></path></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Review Modal -->
        <section id="review-section" class="fixed inset-x-0 bottom-0 bg-brand rounded-t-[40px] p-12 text-white text-center z-[50] hidden translate-y-full transition-transform duration-700 shadow-2xl">
            <div class="w-12 h-1.5 bg-white/20 rounded-full mx-auto mb-10"></div>
            <h3 class="text-[32px] font-black mb-2 tracking-tighter leading-tight">Service Complete</h3>
            <p class="text-brand-surface opacity-80 text-[16px] mb-12 font-medium">How would you rate your experience?</p>
            
            <div class="flex justify-center gap-5 mb-14">
                <button class="w-16 h-16 bg-white/10 rounded-[24px] flex items-center justify-center text-4xl active:bg-white/30 transition-colors" onclick="setRating(1)">★</button>
                <button class="w-16 h-16 bg-white/10 rounded-[24px] flex items-center justify-center text-4xl active:bg-white/30 transition-colors" onclick="setRating(2)">★</button>
                <button class="w-16 h-16 bg-white/10 rounded-[24px] flex items-center justify-center text-4xl active:bg-white/30 transition-colors" onclick="setRating(3)">★</button>
                <button class="w-16 h-16 bg-white/10 rounded-[24px] flex items-center justify-center text-4xl active:bg-white/30 transition-colors" onclick="setRating(4)">★</button>
                <button class="w-16 h-16 bg-white/10 rounded-[24px] flex items-center justify-center text-4xl active:bg-white/30 transition-colors" onclick="setRating(5)">★</button>
            </div>
            
            <button class="w-full bg-white text-brand font-black py-6 rounded-[28px] btn-press shadow-2xl text-[18px] uppercase tracking-widest" onclick="submitReview()">Confirm & Finish</button>
        </section>
    </div>
</div>

<script src="/static/liff/js/app.js?v=1.0.6"></script>
<script src="/static/liff/js/tracking.js?v=1.0.8"></script>
<script src="https://maps.googleapis.com/maps/api/js?key=__MAP_API__&libraries=maps,marker,geometry&callback=initTrackingMap" async defer></script>

</body>
</html>
