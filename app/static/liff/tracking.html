<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Momo — Live Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="maps-api-key" content="__MAP_API__">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link rel="stylesheet" href="/static/liff/css/style.css?v=1.0.7">
    <link rel="stylesheet" href="/static/liff/css/design-system.css?v=1.0.7">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Inter"', 'sans-serif'] },
                    colors: {
                        brand: { DEFAULT: '#046c4e', light: '#059669', dark: '#034a36', surface: '#f0fdf4' },
                        ink: { DEFAULT: '#111827', muted: '#4b5563', light: '#9ca3af' }
                    },
                    boxShadow: {
                        'premium': '0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03)',
                        'sheet': '0 -10px 40px rgba(0,0,0,0.08)'
                    }
                }
            }
        }
    </script>
    <style>
        body, html { height: 100%; overflow: hidden; background: #f9fafb; }
        #map-container { position: absolute; inset: 0; z-index: 0; background: #f3f4f6; }
        #bottom-sheet { 
            transform: translateY(0); 
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            border-top: 1px solid rgba(0,0,0,0.02);
        }
    </style>
</head>
<body class="antialiased">

<div id="app-container" class="h-full w-full relative">
    
    <div id="loading" class="fixed inset-0 bg-brand z-[9999] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="w-12 h-12 border-4 border-white/20 border-t-white rounded-full animate-spin"></div>
        <div class="font-bold tracking-[0.2em] uppercase text-[11px] mt-6 text-white/80">Syncing Live Data</div>
    </div>

    <div id="app-content" class="h-full w-full relative overflow-hidden">
        
        <!-- Layer 0: Map -->
        <div id="map-container">
            <div id="map" class="w-full h-full grayscale-[0.1] contrast-[1.05]"></div>
        </div>

        <!-- Layer 1: Top Controls -->
        <div class="absolute top-0 left-0 w-full z-20 pt-[env(safe-area-inset-top,24px)] px-5 pointer-events-none">
            <a href="/liff/index" class="w-12 h-12 bg-white rounded-[20px] flex items-center justify-center shadow-premium border border-gray-100 btn-press pointer-events-auto">
                <svg class="w-6 h-6 text-ink" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
            </a>
        </div>

        <!-- Layer 1: Recenter FAB -->
        <div class="absolute right-5 z-20 pointer-events-auto transition-all" style="bottom: calc(260px + env(safe-area-inset-bottom, 20px));">
            <button id="recenter-btn" class="w-14 h-14 bg-brand text-white rounded-[22px] flex items-center justify-center shadow-xl btn-press">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path d="M12 2v2m0 16v2M4 12H2m20 0h-2"></path><circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </div>

        <!-- Layer 2: Bottom Sheet -->
        <div id="bottom-sheet" class="absolute bottom-0 w-full bg-white rounded-t-[40px] shadow-sheet z-40 pb-[env(safe-area-inset-bottom,24px)]">
            
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mt-4 mb-6"></div>
            
            <div class="px-8 flex justify-between items-start mb-8">
                <div>
                    <span class="text-[11px] font-black uppercase tracking-[0.2em] text-brand/50 block mb-1.5">Live Tracking</span>
                    <h3 class="text-[26px] font-black text-ink leading-none tracking-tighter" id="status-title">Searching...</h3>
                    <p class="text-[14px] text-ink-muted font-bold mt-2 flex items-center gap-2" id="distance-display">
                        <span class="w-1.5 h-1.5 bg-brand rounded-full animate-pulse"></span>
                        Connecting to provider
                    </p>
                </div>
                <div class="bg-brand-surface text-brand font-black px-4 py-2.5 rounded-2xl text-[16px] border border-brand/10 shadow-sm" id="eta-display-small">-- min</div>
            </div>

            <!-- Progress -->
            <div class="px-8 mb-10">
                <div class="relative h-1.5 bg-slate-100 rounded-full overflow-hidden">
                    <div id="tracker-progress" class="absolute inset-y-0 left-0 bg-brand transition-all duration-1000 ease-out shadow-[0_0_10px_rgba(4,108,78,0.3)]" style="width: 0%"></div>
                </div>
                <div class="flex justify-between mt-4">
                    <span class="text-[10px] font-black uppercase tracking-widest text-brand" id="label-1">Confirmed</span>
                    <span class="text-[10px] font-black uppercase tracking-widest text-ink-muted/30" id="label-2">Arrived</span>
                    <span class="text-[10px] font-black uppercase tracking-widest text-ink-muted/30" id="label-3">In-Progress</span>
                    <span class="text-[10px] font-black uppercase tracking-widest text-ink-muted/30" id="label-4">Finished</span>
                </div>
            </div>

            <div class="px-8">
                <div class="bg-gray-50 rounded-[32px] p-5 flex items-center gap-5 border border-gray-100 shadow-inner">
                    <div class="w-16 h-16 rounded-[24px] overflow-hidden bg-white border-4 border-white shadow-md relative shrink-0">
                        <img id="maid-pic" src="https://ui-avatars.com/api/?name=M&background=046c4e&color=fff" class="w-full h-full object-cover" alt="">
                    </div>
                    <div class="flex-1 min-w-0">
                        <h2 class="font-black text-[18px] text-ink truncate tracking-tight" id="maid-name">Assigning...</h2>
                        <div class="flex items-center gap-2 mt-1">
                            <div class="flex items-center text-yellow-500 bg-white px-2 py-0.5 rounded-lg shadow-sm border border-gray-100">
                                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                                <span class="text-[13px] font-black text-ink ml-1" id="maid-rating">4.9</span>
                            </div>
                            <span class="text-[13px] font-bold text-ink-muted truncate" id="maid-tier">• Elite Pro</span>
                        </div>
                    </div>
                    <div class="flex gap-2.5 shrink-0">
                        <button class="w-11 h-11 rounded-2xl bg-white border border-gray-200 text-blue-600 flex items-center justify-center btn-press shadow-sm" onclick="showToast('Calling...', 'info')">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Terminal Section -->
        <section id="review-section" class="fixed inset-x-0 bottom-0 bg-brand rounded-t-[40px] p-10 text-white text-center z-[50] hidden translate-y-full transition-transform duration-700 ease-in-out shadow-2xl">
            <div class="w-12 h-1.5 bg-white/20 rounded-full mx-auto mb-10"></div>
            <h3 class="text-[28px] font-black mb-2 tracking-tighter leading-none">Service Complete</h3>
            <p class="text-brand-surface opacity-80 text-[15px] mb-12 font-medium">How was your experience today?</p>
            
            <div class="flex justify-center gap-4 mb-12">
                <button class="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center text-3xl" onclick="setRating(1)">★</button>
                <button class="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center text-3xl" onclick="setRating(2)">★</button>
                <button class="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center text-3xl" onclick="setRating(3)">★</button>
                <button class="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center text-3xl" onclick="setRating(4)">★</button>
                <button class="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center text-3xl" onclick="setRating(5)">★</button>
            </div>
            
            <button class="w-full bg-white text-brand font-black py-5 rounded-[28px] btn-press shadow-2xl text-[16px] uppercase tracking-widest" onclick="submitReview()">Submit Feedback</button>
        </section>
    </div>
</div>

<script src="/static/liff/js/app.js?v=1.0.6"></script>
<script src="/static/liff/js/tracking.js?v=1.0.6"></script>
<script src="https://maps.googleapis.com/maps/api/js?key=__MAP_API__&libraries=maps,marker,geometry&callback=initTrackingMap" async defer></script>

</body>
</html>
